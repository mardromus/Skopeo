# One container serves the UI and the API on http://localhost:8000.
#   docker compose up --build
services:
  skopeo:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      SKOPEO_MODE: ${SKOPEO_MODE:-mock}
      SKOPEO_DEMO_MODE: ${SKOPEO_DEMO_MODE:-true}
      SKOPEO_DEMO_STEP_DELAY_MS: ${SKOPEO_DEMO_STEP_DELAY_MS:-150}
      DRY_RUN: ${DRY_RUN:-true}
      SKOPEO_SANDBOX_EXECUTION: ${SKOPEO_SANDBOX_EXECUTION:-false}
      SKOPEO_API_KEY: ${SKOPEO_API_KEY:-}
    volumes:
      - skopeo-data:/data
    ports:
      - "8000:8000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  skopeo-data:
