name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend · lint and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Pytest (unit, integration, end-to-end)
        run: python -m pytest -q

  frontend:
    name: Frontend · lint and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build

  container:
    name: Container · build and run the reference case
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build the single-container image
        run: docker build -t skopeo:ci .
      - name: Build the split backend / frontend images
        run: |
          docker build -f backend/Dockerfile -t skopeo-api:ci .
          docker build -f frontend/Dockerfile -t skopeo-web:ci .
      - name: Start the container
        run: |
          docker run -d --name skopeo -p 8000:8000 -e SKOPEO_DEMO_STEP_DELAY_MS=0 skopeo:ci
          for i in $(seq 1 60); do curl -fsS http://localhost:8000/api/health && break; sleep 2; done
          curl -fsS http://localhost:8000/api/health
      - name: UI is served from the same origin
        run: |
          curl -fsS http://localhost:8000/ | grep -q 'id="root"'
          curl -fsS http://localhost:8000/investigations/anything | grep -q 'id="root"'
          curl -fsSI http://localhost:8000/ | grep -qi "content-security-policy"
      - name: Run the reference investigation end to end
        run: |
          id=$(curl -fsS -X POST http://localhost:8000/api/demo/investigations \
                 -H 'Content-Type: application/json' -d '{"step_delay_ms": 0}' \
               | python3 -c 'import sys, json; print(json.load(sys.stdin)["investigation_id"])')
          echo "investigation $id"
          status=running
          for i in $(seq 1 100); do
            status=$(curl -fsS http://localhost:8000/api/investigations/$id | python3 -c 'import sys, json; print(json.load(sys.stdin)["status"])')
            case "$status" in queued|running) sleep 3 ;; *) break ;; esac
          done
          echo "status: $status"
          test "$status" = "completed_with_limitations"
          curl -fsS "http://localhost:8000/api/investigations/$id/report?format=json" | python3 -c '
          import json, sys
          r = json.load(sys.stdin)
          s = r["execution_summary"]
          print({k: s[k] for k in ("findings", "verified", "rejected", "insufficient_evidence", "agent_runs", "agent_failures", "replans", "parallelism")})
          assert s["verified"] >= 15 and s["rejected"] >= 1 and s["agent_failures"] == 1 and s["replans"] >= 1
          assert any(f["rule_id"] == "security.hardcoded_secret" and f["status"] == "rejected" for f in r["findings"])
          assert any(c["relationship_type"] == "compound_risk" and c["status"] == "verified" for c in r["correlations"])
          assert r["risks"] and all(m["status"] == "verified" for m in r["findings"] if any(m["finding_id"] in k["member_finding_ids"] for k in r["risks"]))
          '
      - name: Container logs
        if: always()
        run: docker logs skopeo 2>&1 | tail -80
