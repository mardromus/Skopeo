# Render blueprint — "New > Blueprint" in the Render dashboard, or the Deploy button in the README.
services:
  - type: web
    name: skopeo
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # live + groq: agent decisions, summaries and the repo chatbot use Groq once GROQ_API_KEY is set;
      # without a key the app stays in its deterministic built-in mode.
      - key: SKOPEO_MODE
        value: live
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      # Keep data across restarts on the free plan: paste a free Neon Postgres URL here
      # (postgresql://user:password@host/db?sslmode=require). Blank = SQLite, erased on every restart.
      - key: DATABASE_URL
        sync: false
      # One scheduler query every 30 min lets a free Neon database sleep between checks.
      - key: WATCH_SCHEDULER_INTERVAL_SECONDS
        value: "1800"
      - key: SKOPEO_DEMO_MODE
        value: "true"
      - key: SKOPEO_DEMO_STEP_DELAY_MS
        value: "150"
      - key: DRY_RUN
        value: "true"
      # Anyone can run the bundled reference case; scanning other repositories needs this key.
      - key: SKOPEO_API_KEY
        generateValue: true
      - key: SKOPEO_DEMO_PUBLIC
        value: "true"
      - key: RATE_LIMIT_PER_MINUTE
        value: "4"
      - key: MAX_CONCURRENT_INVESTIGATIONS
        value: "1"
      # Google sign-in (docs/firebase-setup.md). Leave unset for a single local workspace.
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_WEB_API_KEY
        sync: false
      - key: FIREBASE_AUTH_DOMAIN
        sync: false
      - key: FIREBASE_APP_ID
        sync: false
      # GitHub sign-in and repository import. SKOPEO_SECRET_KEY encrypts the stored GitHub tokens.
      - key: AUTH_GITHUB_ENABLED
        value: "true"
      - key: GITHUB_PRIVATE_REPOS
        value: "false"
      - key: SKOPEO_SECRET_KEY
        generateValue: true
      # Notifications (docs/notifications.md)
      - key: PUBLIC_BASE_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      # Email over HTTPS (works on Render free, where SMTP ports are blocked): brevo or resend
      - key: EMAIL_PROVIDER
        sync: false
      - key: EMAIL_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
    # The free plan has no persistent disk: without DATABASE_URL, cases, accounts and watches are kept
    # only until the service restarts. The service sleeps when idle, so scheduled watch checks run only
    # while it is awake. Alternative to DATABASE_URL on a paid plan: uncomment the disk below.
    # disk:
    #   name: skopeo-data
    #   mountPath: /data
    #   sizeGB: 1
